        let currentFilter = 'all';

        // Load saved state from localStorage
        function getSavedProgress() {
            try {
                const saved = localStorage.getItem('ssc_chsl_progress_2026');
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                return {};
            }
        }

        function saveProgress(progressObj) {
            try {
                localStorage.setItem('ssc_chsl_progress_2026', JSON.stringify(progressObj));
            } catch (e) {}
        }

        // Toggle Task Completion
        function toggleTask(id) {
            const progress = getSavedProgress();
            progress[id] = !progress[id];
            saveProgress(progress);
            renderApp();
        }

        // Toggle Card Expansion
        function toggleExpand(id) {
            const contentEl = document.getElementById(`content-${id}`);
            const iconEl = document.getElementById(`icon-${id}`);
            if (contentEl.classList.contains('hidden')) {
                contentEl.classList.remove('hidden');
                iconEl.classList.add('rotate-180');
            } else {
                contentEl.classList.add('hidden');
                iconEl.classList.remove('rotate-180');
            }
        }

        // Filter Phase
        function filterPhase(phase) {
            currentFilter = phase;
            ['all', 'phase1', 'phase2', 'phase3'].forEach(p => {
                const btn = document.getElementById(`tab-${p}`);
                if (p === phase) {
                    btn.className = "flex-1 py-2 rounded-lg bg-indigo-600 text-white smooth-transition shadow-sm";
                } else {
                    btn.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white smooth-transition";
                }
            });
            renderChecklist();
        }

        // Reset Progress
        function resetProgress() {
            if (confirm("Are you sure you want to reset all your checklist progress?")) {
                localStorage.removeItem('ssc_chsl_progress_2026');
                renderApp();
            }
        }

        // Render Checklist Items
        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            const progress = getSavedProgress();
            
            const filteredData = studyPlanData.filter(item => {
                if (currentFilter === 'all') return true;
                return item.phase === currentFilter;
            });

            container.innerHTML = '';

            filteredData.forEach(item => {
                const isChecked = !!progress[item.id];

                const card = document.createElement('div');
                card.className = `bg-slate-900 border ${isChecked ? 'border-emerald-500/30 bg-emerald-950/10' : 'border-slate-800'} rounded-2xl p-4 smooth-transition shadow-sm`;

                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex items-start space-x-3 flex-1 cursor-pointer" onclick="toggleTask('${item.id}')">
                            <div class="mt-0.5 w-6 h-6 rounded-lg border ${isChecked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-700 bg-slate-800'} flex items-center justify-center smooth-transition flex-shrink-0">
                                ${isChecked ? '<i class="fa-solid fa-check text-xs font-bold"></i>' : ''}
                            </div>
                            <div class="flex-1 pr-2">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-800 text-indigo-400 border border-slate-700">${item.date}</span>
                                    <span class="text-xs text-slate-500 font-medium">Day ${item.dayNumber}</span>
                                </div>
                                <h3 class="font-semibold text-sm mt-1 ${isChecked ? 'line-through text-slate-400' : 'text-slate-200'}">${item.title}</h3>
                            </div>
                        </div>
                        <button onclick="toggleExpand('${item.id}')" class="p-2 text-slate-400 hover:text-slate-200 smooth-transition">
                            <i id="icon-${item.id}" class="fa-solid fa-chevron-down text-xs smooth-transition"></i>
                        </button>
                    </div>

                    <!-- Expandable Subtasks & YouTube Link -->
                    <div id="content-${item.id}" class="hidden mt-3 pt-3 border-t border-slate-800/80 space-y-3">
                        <ul class="space-y-1.5 text-xs text-slate-300 pl-2">
                            ${item.sublines.map(sub => `<li class="flex items-start space-x-2"><span class="text-indigo-400 mt-0.5">•</span><span>${sub}</span></li>`).join('')}
                        </ul>
                        <div class="pt-1">
                            <a href="${item.youtube}" target="_blank" class="inline-flex items-center space-x-1.5 text-xs font-medium text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 px-3 py-1.5 rounded-xl smooth-transition">
                                <i class="fa-brands fa-youtube text-rose-500 text-sm"></i>
                                <span>${item.youtubeLabel}</span>
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Render Dashboard Stats & Progress
        function renderDashboard() {
            const progress = getSavedProgress();
            const totalDays = studyPlanData.length;
            const completedCount = studyPlanData.filter(item => progress[item.id]).length;
            const percentage = Math.round((completedCount / totalDays) * 100);

            // Update Progress Bar
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${completedCount} / ${totalDays} Days (${percentage}%)`;

            // Calculate streak (consecutive completed starting from Day 1)
            let streak = 0;
            for (let i = 0; i < studyPlanData.length; i++) {
                if (progress[studyPlanData[i].id]) {
                    streak++;
                } else {
                    break;
                }
            }

            document.getElementById('streak-count').innerText = `${streak} Days Streak`;

            // Completion Banner
            const banner = document.getElementById('completion-banner');
            if (completedCount === totalDays) {
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }

        // Full App Render
        function renderApp() {
            renderDashboard();
            renderChecklist();
        }

        // Initial Load on Window Load
        window.onload = function () {
            renderApp();
        };
    </script>
